<div class="availability-container">

  <div class="availability-card">

    <h1>Configurar disponibilidad</h1>

    <p class="subtitle">
      Selecciona las franjas horarias en las que deseas aceptar citas.
    </p>

    <div *ngFor="let day of days" class="day-block">

      <h3>{{ getDayName(day) }}</h3>

      <div class="hours">

        <button
          *ngFor="let hour of hours"
          (click)="toggleSlot(day, hour)"
          [class.selected]="isSelected(day, hour)"
        >
          {{ hour }}:00
        </button>

      </div>

    </div>

    <div class="save-container">

      <button
        class="save-btn"
        (click)="save()"
      >
        Guardar cambios
      </button>

    </div>

  </div>

</div>
